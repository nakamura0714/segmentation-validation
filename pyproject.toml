[project]
name = "segmentation-validation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "matplotlib-fontja>=1.1.0",
    "numpy>=2.5.2",
    # GUI は使わないため headless。fiftyone が opencv-python-headless<5 を要求するので、
    # 同一環境に opencv-python と共存させないためにも headless に統一する。
    "opencv-python-headless>=4.14,<5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pydicom>=3.0.2",
    # pydicom 本体は非圧縮しか展開できない。実データには JPEG Lossless
    # (Process 14 SV1, 1.2.840.10008.1.2.4.70) の DICOM が 444 件あり、
    # これが無いと export-lpdata の画像変換がその分だけ失敗する。
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.1",
    # export-lpdata がデータセットテンプレート（med-chest-metry-pi6 の YAML）を読むため。
    # 出力は JSON なので、書き出し側では使わない。
    "pyyaml>=6.0",
]

[project.scripts]
segmentation-validation = "segmentation_validation.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.5",
]
# 目視レビュー用。検証本体は fiftyone を import しないので `uv sync` だけで動く。
review = [
    "fiftyone>=1.21.0",
]
# README 3章の手順を notebooks/pipeline.ipynb から実行するため。
notebook = [
    "jupyter>=1.1.1",
    "ipykernel>=6.30.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 実データ・FiftyOne・時間のかかるものは既定で走らせない。
# 既定の `uv run pytest` は合成データだけで数秒で終わること。
addopts = "-q -m 'not realdata and not fiftyone'"
markers = [
    "realdata: 実データ（/mnt のデータセットJSONと走査キャッシュ）を必要とする",
    "fiftyone: fiftyone と mongod を必要とする",
]
filterwarnings = [
    # fiftyone 1.21 が datetime.utcnow() を大量に使っており、
    # 1回の実行で475件出て結果が読めなくなる。こちらでは直せない。
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]
