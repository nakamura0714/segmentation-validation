[project]
name = "segmentation-validation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "matplotlib-fontja>=1.1.0",
    "numpy>=2.5.2",
    # GUI は使わないため headless。fiftyone が opencv-python-headless<5 を要求するので、
    # 同一環境に opencv-python と共存させないためにも headless に統一する。
    "opencv-python-headless>=4.14,<5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pydicom>=3.0.2",
]

[project.scripts]
segmentation-validation = "segmentation_validation.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
# 目視レビュー用。検証本体は fiftyone を import しないので `uv sync` だけで動く。
review = [
    "fiftyone>=1.21.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
